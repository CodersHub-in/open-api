<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAPI Docs | CodersHubInc</title>
    <style>
        /* CodersHubInc Theme Variables */
        :root {
            --bg-base: rgb(10, 10, 10);
            --bg-surface: rgb(18, 18, 18);
            --border: rgb(39, 39, 42);
            --text-main: rgb(250, 250, 250);
            --text-muted: rgb(161, 161, 170);
            --accent: rgb(39, 39, 42);
            --accent-fg: rgb(250, 250, 250);
            --get-color: #4ade80;
            --post-color: #60a5fa;
            --radius: 0.5rem;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        header {
            padding: 1rem 2rem;
            background-color: var(--bg-base);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: -0.025em;
        }

        .layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        aside {
            width: 250px;
            background-color: var(--bg-base);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1.5rem 1rem;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 3rem;
            scroll-behavior: smooth;
        }

        /* Sidebar Nav */
        .nav-group {
            margin-bottom: 1.5rem;
        }

        .nav-group-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        .nav-link {
            display: block;
            padding: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: var(--radius);
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background-color: var(--accent);
            color: var(--text-main);
        }

        /* API Cards */
        .endpoint-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .endpoint-header {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .endpoint-header:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .method {
            font-family: monospace;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-right: 1rem;
        }

        .method.get {
            background-color: rgba(74, 222, 128, 0.1);
            color: var(--get-color);
        }

        .method.post {
            background-color: rgba(96, 165, 250, 0.1);
            color: var(--post-color);
        }

        .route {
            font-family: monospace;
            font-size: 1rem;
            color: var(--text-main);
        }

        .desc {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .endpoint-body {
            padding: 1.5rem;
            display: none;
        }

        .endpoint-body.active {
            display: block;
        }

        /* Inputs & Buttons */
        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-family: monospace;
        }

        .input-group input {
            width: 100%;
            background-color: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            font-family: monospace;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        button.send-btn {
            background-color: var(--text-main);
            color: var(--bg-base);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.send-btn:hover {
            opacity: 0.8;
        }

        /* Response Area */
        .response-box {
            margin-top: 1rem;
            background-color: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .response-header {
            padding: 0.5rem 1rem;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .response-content {
            padding: 1rem;
            margin: 0;
            font-family: monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>

<body>

    <header>
        <h1>CodersHubInc | OpenAPI</h1>
    </header>

    <div class="layout">
        <aside id="sidebar">
        </aside>

        <main id="main-content">
            <div style="margin-bottom: 3rem;">
                <h2 style="margin-top: 0;">Interactive API Reference</h2>
                <p style="color: var(--text-muted);">Expand an endpoint below to test the live API. Variables starting
                    with <code>:</code> require input.</p>
            </div>

            <div id="endpoints-container">
            </div>
        </main>
    </div>

    <script>
        // The base URL for the API calls
        const BASE_URL = window.location.origin; // Uses current domain automatically

        // Define the API Structure based on your Express routes
        // Define the API Structure based on your Express routes
        const apiData = [
            {
                group: "v0.1 Random Image",
                endpoints: [
                    { method: "GET", route: "/v0.1/random_image", desc: "Auto-generated random avatar" },
                    { method: "GET", route: "/v0.1/random-image/:imageType", desc: "Specific image type (png, jpg, svg)" },
                    { method: "GET", route: "/v0.1/random_image/img/:query", desc: "Avatar generated by seed query" },
                    { method: "GET", route: "/v0.1/random_image/t/:avatarStyle/:query/:imageType", desc: "Fully customizable avatar" }
                ]
            },
            {
                group: "v0.1 Random User",
                endpoints: [
                    { method: "GET", route: "/v0.1/random_user", desc: "Basic random user profile" },
                    { method: "GET", route: "/v0.1/random_user/big", desc: "Detailed random user profile" },
                    { method: "GET", route: "/v0.1/random_user/big0", desc: "Extensive random user data" },
                    { method: "GET", route: "/v0.1/random_user/:any/:query", desc: "Testing / Error Endpoint" }
                ]
            },
            {
                group: "v1.0 Country Info",
                endpoints: [
                    { method: "GET", route: "/v1.0/contry", desc: "Get base country data" },
                    { method: "GET", route: "/v1.0/contry/random", desc: "Get random country data" },
                    { method: "GET", route: "/v1.0/contry/:contryCode", desc: "Data by Country Code (e.g., IN, US, GB)" }
                ]
            },
            {
                group: "v1.0 Address Data",
                endpoints: [
                    { method: "GET", route: "/v1.0/address", desc: "Get base address data" },
                    { method: "GET", route: "/v1.0/address/random", desc: "Get random address" },
                    { method: "GET", route: "/v1.0/address/:contryCode", desc: "Address by Country Code" }
                ]
            },
            {
                group: "v1.0 Localized Users",
                endpoints: [
                    { method: "GET", route: "/v1.0/user", desc: "Get localized user data" },
                    { method: "GET", route: "/v1.0/user/:contryCode", desc: "User data by Country Code" }
                ]
            },
            {
                group: "v1.0 Developer Tools",
                endpoints: [
                    { method: "GET", route: "/v1.0/github/user", desc: "GitHub User Info" },
                    { method: "GET", route: "/v1.0/github/user/random", desc: "Random GitHub Profile" },
                    { method: "GET", route: "/v1.0/github/avatar/random", desc: "Random GitHub Avatar" },
                    { method: "GET", route: "/v1.0/gravatar", desc: "Gravatar API integration" }
                ]
            },
            {
                group: "v1.0 Media & Utility",
                endpoints: [
                    { method: "GET", route: "/v1.0/saavnCDN", desc: "JioSaavn CDN Integration" },
                    { method: "GET", route: "/v1.0/crypt/c", desc: "Crypt / Encode Data" },
                    { method: "POST", route: "/v1.0/crypt/c", desc: "Crypt / Encode Data (POST)" },
                    { method: "GET", route: "/v1.0/crypt/d", desc: "Crypt / Decode Data" },
                    { method: "POST", route: "/v1.0/crypt/d", desc: "Crypt / Decode Data (POST)" }
                ]
            }
        ];
        const sidebar = document.getElementById('sidebar');
        const container = document.getElementById('endpoints-container');

        // Helper: Extract parameters (e.g. :query, :imageType)
        const extractParams = (route) => {
            const matches = route.match(/:[a-zA-Z0-9]+/g);
            return matches ? matches.map(m => m.substring(1)) : [];
        };

        // Initialize UI
        function initDocs() {
            apiData.forEach((section, sIdx) => {
                const safeGroupId = section.group.replace(/[^a-z0-9]/gi, '-').toLowerCase();

                // 1. Build Sidebar Link
                sidebar.innerHTML += `
                    <div class="nav-group">
                        <div class="nav-group-title">${section.group}</div>
                        ${section.endpoints.map((e, eIdx) => `<a href="#api-${sIdx}-${eIdx}" class="nav-link">${e.route}</a>`).join('')}
                    </div>
                `;

                // 2. Build Endpoint Cards
                section.endpoints.forEach((api, eIdx) => {
                    const params = extractParams(api.route);
                    const cardId = `api-${sIdx}-${eIdx}`;

                    let inputsHtml = params.map(p => `
                        <div class="input-group">
                            <label>${p}</label>
                            <input type="text" id="${cardId}-input-${p}" placeholder="Enter value for ${p}">
                        </div>
                    `).join('');

                    container.innerHTML += `
                        <div class="endpoint-card" id="${cardId}">
                            <div class="endpoint-header" onclick="toggleBody('${cardId}')">
                                <span class="method ${api.method.toLowerCase()}">${api.method}</span>
                                <span class="route">${api.route}</span>
                                <span class="desc">${api.desc}</span>
                            </div>
                            <div class="endpoint-body" id="${cardId}-body">
                                ${inputsHtml}
                                <button class="send-btn" onclick="sendReq('${cardId}', '${api.method}', '${api.route}')">Send Request</button>
                                
                                <div class="response-box" id="${cardId}-res-box" style="display: none;">
                                    <div class="response-header">
                                        <span>Response</span>
                                        <span id="${cardId}-status">...</span>
                                    </div>
                                    <pre class="response-content" id="${cardId}-res-content"></pre>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // Toggle visibility of the card body
        window.toggleBody = (id) => {
            const body = document.getElementById(`${id}-body`);
            body.classList.toggle('active');
        };

        // Handle the Fetch request
        window.sendReq = async (id, method, rawRoute) => {
            const params = extractParams(rawRoute);
            let finalRoute = rawRoute;

            // Inject user inputs into route
            params.forEach(p => {
                const val = document.getElementById(`${id}-input-${p}`).value;
                finalRoute = finalRoute.replace(`:${p}`, val || `test-${p}`); // fallback if empty
            });

            const targetUrl = BASE_URL + finalRoute;
            const resBox = document.getElementById(`${id}-res-box`);
            const resContent = document.getElementById(`${id}-res-content`);
            const statusLabel = document.getElementById(`${id}-status`);

            resBox.style.display = 'block';
            resContent.innerText = "Fetching data...";
            statusLabel.innerText = "Loading...";
            statusLabel.style.color = "var(--text-muted)";

            try {
                const start = performance.now();
                const response = await fetch(targetUrl, { method });
                const end = performance.now();

                statusLabel.innerText = `${response.status} • ${Math.round(end - start)}ms`;
                statusLabel.style.color = response.ok ? "var(--get-color)" : "#ef4444";

                const contentType = response.headers.get("content-type");

                if (contentType && contentType.includes("image")) {
                    const blob = await response.blob();
                    const imgUrl = URL.createObjectURL(blob);
                    resContent.innerHTML = `<img src="${imgUrl}" alt="API Result" style="max-width: 200px; border-radius: 4px;">`;
                } else if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    resContent.innerText = JSON.stringify(data, null, 2);
                } else {
                    const text = await response.text();
                    resContent.innerText = text;
                }
            } catch (err) {
                statusLabel.innerText = "Error";
                statusLabel.style.color = "#ef4444";
                resContent.innerText = err.message + "\n\nIs your Node.js server running?";
            }
        };

        // Run on load
        initDocs();
    </script>
</body>

</html>
